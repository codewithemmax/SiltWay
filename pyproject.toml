[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-router"
version = "0.1.0"
description = "Flood-resilient supply chain routing service for Nigeria"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pyshp>=2.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "networkx>=3.0",
    "pyarrow>=14.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "httpx>=0.25",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
include = ["floodrouter*", "service*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
